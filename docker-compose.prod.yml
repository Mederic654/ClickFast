services:
  db:
    image: postgres:16-alpine
    container_name: clickfast-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - clickfast-db-data:/var/lib/postgresql/data
    networks:
      - clickfast-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  scores-api:
    image: mederic76/scores-api:1.0.1
    container_name: clickfast-scores-api
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "${API_PORT}:4000"
    networks:
      - clickfast-network
    depends_on:
      db:
        condition: service_healthy

  stats-api:
    image: mederic76/stats-api:1.0.0
    container_name: clickfast-stats-api
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    ports:
      - "${STATS_PORT}:5000"
    networks:
      - clickfast-network
    depends_on:
      db:
        condition: service_healthy

  game:
    image: mederic76/clickfast:1.0.0
    container_name: clickfast
    ports:
      - "${GAME_PORT}:80"
    networks:
      - clickfast-network

  adminer:
    image: adminer:4.8.1
    container_name: clickfast-adminer
    ports:
      - "${ADMINER_PORT}:8080"
    networks:
      - clickfast-network
    depends_on:
      - db

networks:
  clickfast-network:

volumes:
  clickfast-db-data:
