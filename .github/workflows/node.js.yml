# This workflow will do a clean installation of node dependencies, cache/restore them, lint, and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main", "pipeline" ]
  pull_request:
    branches: [ "main", "pipeline" ]

jobs:
  security-deps:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npm audit --audit-level=high
    - name: gitleaks
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
    - run: npm ci
    - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast:${{ github.sha }}

  security-image:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Trivy
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast:${{ github.sha }}
        severity: 'HIGH,CRITICAL'
        exit-code: '1'

  sbom:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
    - name: Générer le SBOM avec Syft
      uses: anchore/sbom-action@v0
      with:
        image: ${{ secrets.DOCKERHUB_USERNAME }}/clickfast:${{ github.sha }}
        format: cyclonedx-json
        output-file: sbom-clickfast-${{ github.sha }}.cdx.json
        upload-artifact: false
    - name: Publier le SBOM comme artefact
      uses: actions/upload-artifact@v4
      with:
        name: sbom-clickfast-${{ github.sha }}
        path: sbom-clickfast-${{ github.sha }}.cdx.json

  security-summary:
    needs: [security-deps, security-image, sbom]
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Résumé sécurité
      run: |
        echo "## Résumé sécurité - commit ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Contrôle | Résultat |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| Dépendances (npm audit) | ${{ needs.security-deps.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Secrets (gitleaks) | ${{ needs.security-deps.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Image (Trivy) | ${{ needs.security-image.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| SBOM (Syft) | ${{ needs.sbom.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Dépendances et secrets tournent dans le même job (security-deps) : un statut failure ici veut dire l'un des deux, voir les logs du job pour savoir lequel." >> $GITHUB_STEP_SUMMARY
        echo "Détail des CVE : logs du job Image. Détail des composants : SBOM en artefact téléchargeable sur ce run." >> $GITHUB_STEP_SUMMARY
